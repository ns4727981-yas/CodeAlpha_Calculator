<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha-Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <form onsubmit="return false;">
      <label for="display" class="sr-only"></label>
      <input type="text" readonly id="display">
    </form>
    <div class="buttons">
      <button class="btn btn-func" onclick="memoryClear()">MC</button>
      <button class="btn btn-func" onclick="calculateSquareRoot()">√</button>
      <button class="btn btn-func" onclick="calculatePercentage()">%</button>
      <button class="btn btn-clear" onclick="clearDisplay()">ON|AC</button>

      <button class="btn btn-func" onclick="memoryRecall()">MR</button>
      <button class="btn btn-func" onclick="memorySubtract()">M-</button>
      <button class="btn btn-func" onclick="memoryAdd()">M+</button>
      <button class="btn btn-op" onclick="appendValue('/')">÷</button>

      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>
      <button class="btn" onclick="appendValue('9')">9</button>
      <button class="btn btn-op" onclick="appendValue('*')">×</button>

      <button class="btn" onclick="appendValue('4')">4</button>
      <button class="btn" onclick="appendValue('5')">5</button>
      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn btn-op" onclick="appendValue('-')">-</button> 

      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>
      <button class="btn" onclick="appendValue('3')">3</button>
      <button class="btn btn-op" onclick="appendValue('+')">+</button>

      <button class="btn" onclick="appendValue('0')">0</button>
      <button class="btn" onclick="appendValue('.')">.</button>
      <button class="btn btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
